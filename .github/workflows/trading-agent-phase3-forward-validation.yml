name: trading-agent-phase3-forward-validation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phase3-forward-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python sources
        run: python -m compileall -q agent

      - name: Run Phase 1, Phase 2, Phase 3 and Phase 3.1 tests
        run: python -m unittest discover -s agent/tests -v

      - name: Validate migration and database integrity
        run: >-
          python -c "import tempfile; from pathlib import Path; from agent.memory.database import connect_database, integrity_status; p=Path(tempfile.mkdtemp())/'phase3-forward.sqlite'; c=connect_database(p); s=integrity_status(c); assert s['integrity_ok'] and s['foreign_key_ok'], s; c.close(); print(s)"

      - name: Validate frozen Phase 3 bundle contract
        run: >-
          python -c "from pathlib import Path; from agent.phase3.bundle import validate_bundle; import json; p=Path('reports/trading_agent/phase3/shadow_bundle_manifest.json'); b=validate_bundle(json.loads(p.read_text(encoding='utf-8'))); assert b.bundle_id=='p3-bundle-577e5dfd0702c52c8f5318063703dd616a633704444ba5371e1c74e6dc080c6a'; assert b.historical_reference_cutoff_utc=='2023-12-30T08:00:00Z'; print(b.bundle_id)"

      - name: Enforce one-way execution safety
        run: >-
          python -c "from pathlib import Path; source=''.join(p.read_text(encoding='utf-8') for p in Path('agent/phase3').rglob('*.py')); forbidden=('order_send','order_modify','order_cancel','position_modify','trade_request','close_position','open_position'); assert not any(token in source for token in forbidden); assert 'execution_mode' in source; assert 'live_execution_enabled' in source; print('one-way execution safety passed')"

      - name: Validate MT5 telemetry exporter contract
        run: >-
          python -c "from pathlib import Path; p=Path('outputs/Mentor_RSI_MTF_v1.mq5'); s=p.read_text(encoding='utf-8'); required=('phase3-live-telemetry/1','phase3-opportunity-observation/1','FILE_COMMON','void EmitPhase3Telemetry','void EmitPhase3OpportunityFromShadow','void EmitPhase3OpportunityFromBlocked','source_observation_id','source_audit_family','bar_state','ExportPhase3OpportunityInTester = false','FileFlush(phase3TelemetryHandle)','FileFlush(phase3OpportunityTelemetryHandle)'); assert all(x in s for x in required), [x for x in required if x not in s]; assert 'EmitPhase3OpportunityFromShadow(shadowEvents[index])' in s; assert 'EmitPhase3OpportunityFromBlocked(blockedSignalShadowEvents[index])' in s; print('MT5 dual telemetry contracts present')"

      - name: Validate canonical opportunity coverage contract
        run: >-
          python -c "import json; from pathlib import Path; from agent.phase3.forward import execution_api_path_count; from agent.phase3.ingestion.opportunity import CANONICALIZER_FINGERPRINT; p=Path('reports/trading_agent/phase3_1/telemetry_coverage.json'); r=json.loads(p.read_text(encoding='utf-8')); assert r['phase1_dataset_fingerprint']=='2dc6dcd74928ed00923fd21f032ba0700f1c9c50459c9e0159872aa2045680ff'; assert r['expected_canonical_count']==3618 and r['actual_canonical_count']==3618; assert r['missing_canonical_count']==0 and r['unexpected_canonical_count']==0 and r['duplicate_canonical_predictions']==0; assert r['canonical_precision']==1.0 and r['canonical_recall']==1.0; assert r['canonicalizer_fingerprint']==CANONICALIZER_FINGERPRINT; assert r['old_primary_source']=='EXECUTION_CANDIDATE' and r['new_primary_source']=='CANONICAL_OPPORTUNITY'; assert r['bundle_id']=='p3-bundle-577e5dfd0702c52c8f5318063703dd616a633704444ba5371e1c74e6dc080c6a'; assert r['historical_reference_cutoff_utc']=='2023-12-30T08:00:00Z'; assert r['forward_run_id']=='NOT_CREATED' and r['authorization_created'] is False and r['task_scheduler_installed'] is False; assert r['live_execution_enabled'] is False and r['forward_collection_status']=='READY' and r['merge_ready'] is False and r['ready_for_phase4'] is False; assert execution_api_path_count('.')==0; print('canonical opportunity coverage contract passed')"

      - name: Check PowerShell runtime scripts
        run: >-
          python -c "from pathlib import Path; p=Path('scripts/phase3'); expected={'install_forward_task.ps1','start_forward_task.ps1','stop_forward_task.ps1','status_forward_task.ps1','uninstall_forward_task.ps1','run_forward_collector.ps1'}; actual={x.name for x in p.glob('*.ps1')}; assert expected <= actual, sorted(expected-actual); text='\n'.join(x.read_text(encoding='utf-8') for x in p.glob('*.ps1')); assert 'BuildBot-Phase3-Forward' in text; assert '-Password' not in text; print(sorted(actual))"

      - name: Check whitespace
        run: git diff --check
